name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Package & publish
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Read version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Package extension
        run: npm run package

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce publish --azure-credential --skip-duplicate --packagePath "pixel-zoom-${{ steps.version.outputs.version }}.vsix"

      - name: Detect Open VSX token
        id: ovsx
        run: echo "enabled=${{ secrets.OVSX_PAT != '' }}" >> "$GITHUB_OUTPUT"

      - name: Ensure Open VSX namespace
        if: steps.ovsx.outputs.enabled == 'true'
        continue-on-error: true
        run: npx --yes ovsx create-namespace max-aucube -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Publish to Open VSX
        if: steps.ovsx.outputs.enabled == 'true'
        continue-on-error: true
        run: npx --yes ovsx publish "pixel-zoom-${{ steps.version.outputs.version }}.vsix" --pat "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          files: pixel-zoom-${{ steps.version.outputs.version }}.vsix
          generate_release_notes: true
